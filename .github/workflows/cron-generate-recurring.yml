name: Generate recurring appointments

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}

jobs:
  generate-recurring:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/generate-recurring
        run: |
          status=$(curl -s -o response.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://esayweak-jl-production.up.railway.app/api/cron/generate-recurring)
          echo "Response body:"
          cat response.json
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Request failed with status $status"
            exit 1
          fi
